- defaults:
    link:
      relink: true
      create: true
      backup: true

- clean: ['~', '~/.config', '~/Library/Application Support/lazygit']

- link:
    ~/.zshrc:
      path: zshrc.mac
    ~/.tmux.conf:
      path: tmux.mac.conf
    ~/.config/ohmyposh:
    ~/.tmux/plugins/tmux-sensible:
    ~/.tmux/plugins/tpm:
    ~/.zsh/plugins/zsh-autocomplete:
    ~/.config/ghostty:
      path: ghostty/common
    "~/Library/Application Support/lazygit/config.yml":
      path: lazygit/mac/config.yml

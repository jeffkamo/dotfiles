# set -g default-terminal "xterm-256color"
set -g default-terminal "screen-256color" # This was recommended by nvim's checkhealth command

# Rebind prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Status Bar config using erikw/tmux-powerline
set-option -g status on
set-option -g status-interval 2
set-option -g status-justify "centre"
set-option -g status-left-length 90
set-option -g status-right-length 90
set-option -g status-left "#(~/tmux-powerline/powerline.sh left)"
set-option -g status-right "#(~/tmux-powerline/powerline.sh right)"
set-hook -g session-created 'run-shell "~/tmux-powerline/powerline.sh init"' # prettifies the window-status segments

# Add TMUX command key mappings for 2nd and 3rd nested instances of TMUX
bind-key -n c-g send-prefix # Send commands to 2nd nested layer of TMUX
bind-key -n c-t send-keys c-g # Send commands to 3rd nested layer of TMUX

# Allow TMUX to be interactive with the mouse
# @URL https://superuser.com/questions/863295/adjusting-screen-split-pane-sizes-in-tmux
set-option -g mouse on

# Enable focus events for Neovim FocusLost/FocusGained autocommands
set-option -g focus-events on

# Act like VIM
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# List of plugins for TPM. Install with `CTRL+B I`
set -g @plugin 'tmux-plugins/tpm'
# Not using vim-tmux-navigator in favor of using nvim-tmux-navigator by alex ghergh. See above
# set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Nybkox/tmux-kanagawa'

# Highlight active pane
set -g pane-active-border-style fg=colour4
set -g pane-border-style fg=colour238
set -g window-style bg=colour235
set -g window-active-style bg=colour0

# Initialize tmux-sensible
run-shell ~/.tmux/plugins/tmux-sensible/sensible.tmux

# ESC in TMUX is delayed. Change timing to reduce the likelihood of
# the ESC key being registered as an ALT in VIM. For example, causing
# issues like, accidentally doing ALT+J when exiting insert mode too fast.
# https://neovim.io/doc/user/faq.html#_esc-in-tmux-or-gnu-screen-is-delayed
set -sg escape-time 10

# Flag a window's tab in the status bar when its Claude instance rings the
# terminal bell (fired by the Claude Code Notification hook when it needs input).
set -g monitor-bell on
set -g bell-action any        # flag the window even if it's the current one
set -g visual-bell off        # no popup message; the tab flag is enough
# NOTE: the bell STYLE + status format are (re)applied AFTER tpm below — the
# kanagawa theme (loaded by tpm) sets window-status-bell-style/format itself and
# would otherwise override anything set here, stripping the red down to bold.

# Initialize TMUX plugin manager (MUST BE AT BOTTOM OF CONF FILE)
run '~/.tmux/plugins/tpm/tpm'

# --- Claude "needs input" window flag (must run AFTER tpm) -------------------
# When a window's Claude instance rings the bell, monitor-bell sets its
# window_bell_flag. Paint that window's tab bold-white-on-red with a trailing
# "!"; otherwise render it in the normal kanagawa style (white on gray). Set
# after tpm so the kanagawa theme can't override it. Commas inside #[...] are
# escaped as "#," because #{?...} uses commas as its own separators.
set -gw window-status-bell-style "fg=#1f1f28,bg=#e82424,bold"
set -gw window-status-format "#{?window_bell_flag,#[fg=#1f1f28#,bg=#e82424#,bold] #I #W ! ,#[fg=#dcd7ba#,bg=#2a2a37] #I #W }"

# --- Same "needs input" flag inside tree mode (prefix + s) -------------------
# Custom choose-tree format: paint a bell-flagged WINDOW row, and any SESSION
# containing one (session_alerts non-empty), bold-white-on-red with a "!". Rows
# without alerts fall back to a clean default. Style attributes are space-
# separated inside #[...] so no comma-escaping is needed. Row type is detected
# via pane_format / window_format (choose-tree sets these per row).
bind s choose-tree -Zs -F "#{?pane_format,#{pane_current_command},#{?window_format,#{?window_bell_flag,#[fg=#1f1f28 bg=#e82424 bold] #{window_index}: #{window_name}  ! #[default],#{window_index}: #{window_name}#{window_flags}},#{?session_alerts,#[fg=#1f1f28 bg=#e82424 bold] ! #{session_name}: #{session_windows} windows #[default],#{session_name}: #{session_windows} windows#{?session_attached, (attached),}}}}"

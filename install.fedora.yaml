- defaults:
    link:
      relink: true
      create: true
      backup: true

- clean: ['~', '~/.config']

- link:
    ~/.zshrc:
    ~/.tmux.conf:
    ~/.config/ohmyposh:
      path: ohmyposh/common
    ~/.tmux/plugins/tmux-sensible:
    ~/.tmux/plugins/tpm:
    ~/.zsh/plugins/zsh-autocomplete:
    ~/.config/ghostty:
      path: ghostty/common
    ~/.config/hypr:
      path: hypr/fedora
    ~/.config/waybar:
      path: waybar/fedora
    ~/.config/lazygit/config.yml:
      path: lazygit/common/config.yml
    /etc/keyd/default.conf:
      # This one might have to be run with sudo
      path: "keyd/default.conf"
